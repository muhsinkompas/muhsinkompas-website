services:
  web:
    build: .
    container_name: muhsin-website-dev
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "app:app"]
    networks:
      - muhsin_network
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  muhsin_network:
    external: true
